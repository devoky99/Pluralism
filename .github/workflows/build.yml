name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version veröffentlichen (z. B. v0.2.0), leer lassen für einen normalen Build"
        required: false
        default: ""

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "27.0"

jobs:
  core-linux:
    name: Kern-Tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Tests PluralismCore
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          swift --version 2>&1 | tee "$RUNNER_TEMP/logs/00-version.log"
          set -o pipefail
          swift test --parallel 2>&1 | tee "$RUNNER_TEMP/logs/10-test.log"
      - name: Logs in Branch ci-logs-linux
        if: always()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -q -b ci-logs-linux
          echo "${{ github.sha }} ${{ job.status }}" > 99-commit.txt
          git add -A && git commit -q -m "CI-Logs ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:ci-logs-linux

  runtime:
    name: QEMU-Laufzeit (macOS 27)
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Laufzeit aus dem Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: build/runtime
          key: runtime-${{ hashFiles('scripts/runtime/**') }}-macos27
      - name: Laufzeit bauen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          sw_vers | tee "$RUNNER_TEMP/logs/00-version.log"
          set -o pipefail
          ./scripts/runtime/build-runtime.sh 2>&1 | tee "$RUNNER_TEMP/logs/10-runtime.log"
      - name: Laufzeit prüfen
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          set -o pipefail
          {
            build/runtime/bin/qemu-system-aarch64 -version
            build/runtime/bin/qemu-img --version | head -1
            build/runtime/bin/swtpm --version
            otool -L build/runtime/bin/qemu-system-aarch64
            cat build/runtime/share/pluralism-runtime.json
            du -sh build/runtime
          } 2>&1 | tee "$RUNNER_TEMP/logs/20-check.log"
          tar -C build -czf build/pluralism-runtime.tar.gz runtime
      - name: Laufzeit hochladen
        uses: actions/upload-artifact@v4
        with:
          name: pluralism-runtime
          path: build/pluralism-runtime.tar.gz
          retention-days: 7
      - name: Fehler als Hinweise
        if: failure()
        run: |
          grep -hE "error|Fehler|fatal|ERROR" "$RUNNER_TEMP"/logs/*.log | tail -40 | while IFS= read -r line; do echo "::error::$line"; done || true
      - name: Logs in Branch ci-logs-runtime
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cd "$RUNNER_TEMP/logs"
          git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -q -b ci-logs-runtime
          echo "${{ github.sha }} ${{ job.status }} cache=${{ steps.cache.outputs.cache-hit }}" > 99-commit.txt
          git add -A && git commit -q -m "CI-Logs ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:ci-logs-runtime

  macos-app:
    name: App bauen (macOS 27, Apple Silicon)
    runs-on: xcode-27
    needs: runtime
    steps:
      - uses: actions/checkout@v4
      - name: Umgebung
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          { xcodebuild -version; swift --version; sw_vers; id; } 2>&1 | tee "$RUNNER_TEMP/logs/00-version.log"
      - name: Laufzeit laden
        uses: actions/download-artifact@v4
        with:
          name: pluralism-runtime
          path: build
      - name: Laufzeit entpacken
        run: tar -C build -xzf build/pluralism-runtime.tar.gz
      - name: App und Prüfprogramm kompilieren
        run: |
          set -o pipefail
          swift build -c release --product Pluralism 2>&1 | tee "$RUNNER_TEMP/logs/10-build.log"
          swift build -c release --product pluralism-netcheck 2>&1 | tee -a "$RUNNER_TEMP/logs/10-build.log"
      - name: Tests
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee "$RUNNER_TEMP/logs/20-test.log"
      - name: Netzwerk-Prüfung (vmnet ohne Root)
        continue-on-error: true
        run: |
          SRC="$(swift build -c release --show-bin-path)/pluralism-netcheck"
          PLAIN="$RUNNER_TEMP/netcheck-unsigned"
          SIGNED="$RUNNER_TEMP/netcheck-signed"
          cp "$SRC" "$PLAIN"
          cp "$SRC" "$SIGNED"
          codesign --force --sign - --timestamp=none --entitlements Resources/Pluralism.entitlements "$SIGNED"
          {
            BIN="$SIGNED"
            codesign -d --entitlements - "$BIN" 2>/dev/null | grep -o "com.apple.security.[a-z.-]*" | tr '\n' ' '; echo
            run() { echo "## $1"; shift; "$BIN" "$@" || echo "exit=$?"; }
            run "A Internet und Mac, vmnet wählt"
            run "B Nur Mac, vmnet wählt"                     --host-only
            run "C fester Bereich (App)"                      --app --subnet 192.168.160.1
            run "D Nur Mac, fester Bereich (App)"             --app --host-only --subnet 192.168.200.1
            run "E VM dreimal starten (App)"                  --app --subnet 192.168.161.1 --cycles 3
            run "F dreimal ohne festen Bereich (App)"         --app --cycles 3
            run "G fester Bereich belegt, Ausweg (App)"       --app --subnet 192.168.162.1 --block
            run "H zwei andere VMs laufen (App)"              --app --subnet 192.168.163.1 --others 2
            run "I fester Bereich mit Netzadresse .0"         --subnet 192.168.96.0
            run "J fester Bereich neu anlegen im selben Prozess" --subnet 192.168.98.1 --cycles 2
            BIN="$PLAIN"; run "K ohne Entitlement"
          } 2>&1 | tee "$RUNNER_TEMP/logs/25-netcheck.log"
      - name: App-Bundle bauen und signieren
        run: |
          set -o pipefail
          PLURALISM_RUNTIME="$PWD/build/runtime" ./scripts/build-app.sh release 2>&1 | tee "$RUNNER_TEMP/logs/30-bundle.log"
      - name: Paket für den Download
        run: |
          cd build
          ditto -c -k --keepParent Pluralism.app Pluralism.zip
          ls -lh Pluralism.zip | tee -a "$RUNNER_TEMP/logs/30-bundle.log"
      - name: App hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Pluralism-app
          path: build/Pluralism.zip
          retention-days: 14
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$INPUT_RELEASE" ]; then TAG="$INPUT_RELEASE"; else TAG="$GITHUB_REF_NAME"; fi
          NOTES="docs/release-notes/${TAG}.md"
          [ -f "$NOTES" ] || NOTES="README.md"
          ASSET="build/Pluralism-${TAG}.zip"
          cp build/Pluralism.zip "$ASSET"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Pluralism ${TAG}" \
              --notes-file "$NOTES" \
              --prerelease
          fi
      - name: Fehler als Hinweise
        if: failure()
        run: |
          grep -hE "error:|failed" "$RUNNER_TEMP"/logs/*.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
      - name: Logs in Branch ci-logs-macos
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/logs"
          git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout -q -b ci-logs-macos
          echo "${{ github.sha }} ${{ job.status }}" > 99-commit.txt
          git add -A && git commit -q -m "CI-Logs ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" HEAD:ci-logs-macos
